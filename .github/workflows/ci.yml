name: CI

# Started by hand only (Actions → Run workflow, or `gh workflow run CI`).
# Policy (Sean, 2026-10-28, same as bigsmall since 2026-10-18): gates run
# locally before every push (`npx tsc --noEmit && npm run lint && npm test
# && npm run build`); a push deploys when Vercel's own build finishes. The
# account's 2,000 shared Actions minutes don't stretch to a job per push at
# ~40 commits an active day for a solo repo. Revisit with a second
# contributor. The build step needs the two PUBLIC Supabase values as
# repository secrets; without them it is skipped and the rest still runs.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (needs Supabase public env)
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
